<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f5c2f" />
    <title>World 5s Cup Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #07130d;
        color: #f4f8f2;
        font-family: system-ui, sans-serif;
      }

      main {
        width: min(420px, calc(100vw - 32px));
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        background: rgba(4, 13, 9, 0.8);
        padding: 24px;
      }

      h1 {
        margin: 0 0 8px;
      }

      p {
        margin: 0;
        color: rgba(244, 248, 242, 0.72);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>World 5s Cup</h1>
      <p>The app shell is offline. Reconnect and reload if this page appears instead of the game.</p>
    </main>
  </body>
</html>
